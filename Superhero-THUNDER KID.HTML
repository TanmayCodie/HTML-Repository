<!DOCTYPE html>
<html>
<head>
<title>My Superhero Card</title>
<style>
body {
    background-color: darkblue;
    color: white;
    font-family: Arial, sans-serif;
}

.hero-name {
    font-size: 60px;
    font-weight: bold;
    color: yellow;
    text-shadow: 3px 3px orange;
}

.tag-line {
    font-style: italic;
    color: lightblue;
    text-transform: capitalize;
}

.made-by {
    color: coral;
    font-style: italic;
}

.badge {
    font-size: 60px;
    font-weight: bold;
    color: gold;
    transform: rotate(15deg);
}

.label {
    text-transform: uppercase;
    text-decoration: underline;
    color: coral;
}

.power {
    font-weight: bold;
    color: lightgreen;
}

.weakness {
    text-decoration: line-through;
    color: grey;
}
</style>
</head>

<body>

<h1 class="hero-name">Thunder Kid</h1>
<p class="tag-line">the most powerful hero in the school!</p>
<h2 class="label">super powers</h2>
<p class="power">As fast as a Cheetah!</p>
<p class="power">Can shoot Thunder out of his hands!</p>
<h2 class="label">Weakness</h2>
<p class="weakness">is not good at maths</p>
<p class="weakness">hates sanskrit</p>
<p class="badge">Top Secret</p>
<h3 class="made by">Made by Tanmay Handa</h3>
</body>
</html>
