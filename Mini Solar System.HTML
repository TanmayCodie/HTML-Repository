<html>
    <head>
        <title>Mini Solar System</title>
        
        <style>

            body {
                background-color: midnightblue;
                text-align: center;
                color: white;
            }

            h1 {
                color:yellow;
                text-shadow: 3px 3px 8px orange;
            }

            .sun {
                width: 150px;
                height: 150px;
                margin: 30px auto;
                background-color: orange;
                border-radius: 50%;
                box-shadow: 0 0 30px yellow;
            }

            .earth {
                width: 100px;
                height: 100px;
                margin: 30px auto;
                background-color:dodgerblue;
                border-radius: 50%;
                box-shadow: 0 0 20px lightblue;
            }

            .mars {
                width: 70px;
                height: 70px;
                margin: 30px auto;
                background-color: orangered;
                border-radius: 50%;
                box-shadow: 0 0 15px red;
            }

        </style>
    </head>

    <body>

        <h1>🚀My Mini Solar System</h1>
        <p>Explore the planets!</p>

        <div>
            <div class="sun">
                <h2>Sun</h2>
            </div>
            <div class="earth">
                <h2>Earth</h2>
            </div>
            <div class="mars">
                <h2>Mars</h2>
            </div>
        </div>
    
    </body>
</html>
